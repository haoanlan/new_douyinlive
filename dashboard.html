          <span style="font-size:12px;color:${d > 0 ? 'var(--orange)' : 'var(--text-muted)'};flex-shrink:0;font-weight:600;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center"><svg viewBox="0 0 24 24" width="12" height="12" style="margin-left:2px;fill:currentColor"><path d="M6 2h12l4 7-10 13L2 9z"/><path d="M2 9h20" stroke="rgba(255,255,255,0.2)" stroke-width="0.7" fill="none"/><path d="M12 22l-4-13h8z" fill="rgba(0,0,0,0.1)"/></svg>${d.toLocaleString()}</span>
        </div>`;
      });
      if (p.activeSessions.length > 5) html += `<div style="text-align:center;font-size:11px;color:var(--text-muted);padding:4px">还有 ${p.activeSessions.length - 5} 场</div>`;
      html += '</div>';
    }
    // 活跃时段
    if (p.hourStats?.length) {
      html += `<div class="profile-section-title" style="margin-top:14px">活跃时段</div>`;
      html += '<div class="hour-chart">';
      const hourArr = Array(24).fill(0);
      p.hourStats.forEach(h => { hourArr[parseInt(h.hour)] = h.count; });
      const fullMax = Math.max(...hourArr, 1);
      hourArr.forEach((cnt, hr) => {
        const pct = (cnt / fullMax * 100);
        html += `<div class="hour-bar" style="height:${Math.max(pct,3)}%;opacity:${cnt ? 0.7 : 0.15}" title="${hr}时: ${cnt}次"></div>`;
      });
      html += '</div>';
      html += '<div class="hour-labels"><span>0</span><span>6</span><span>12</span><span>18</span><span>23</span></div>';
    }

    // ====== 送礼画像分析 ======
    if (p.giftStyle || p.topStreamers?.length) {
      html += `<div class="profile-section-title" style="margin-top:14px">送礼画像</div>`;
      html += `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">`;
      html += `<div style="padding:6px 12px;background:rgba(var(--orange-rgb,255,152,0),0.12);border-radius:6px;font-size:12px;color:var(--orange);display:inline-flex;align-items:center">${esc(p.giftStyle || '-')}</div>`;
      html += `<div style="padding:6px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;font-size:12px;color:var(--text-muted);display:inline-flex;align-items:center;gap:4px">场均 <span style="color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center"><svg viewBox="0 0 24 24" width="12" height="12" style="margin-right:2px;fill:var(--orange)"><path d="M6 2h12l4 7-10 13L2 9z"/><path d="M2 9h20" stroke="rgba(255,255,255,0.2)" stroke-width="0.7" fill="none"/><path d="M12 22l-4-13h8z" fill="rgba(0,0,0,0.1)"/></svg>${(p.avgPerSession || 0).toLocaleString()}</span></div>`;
      html += `<div style="padding:6px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;font-size:12px;color:var(--text-muted);display:inline-flex;align-items:center;gap:4px">巅峰时段 <span style="color:var(--text);font-weight:600">${esc(p.peakHour || '-')}</span></div>`;
      html += '</div>';
      // 最爱送礼主播
      if (p.topStreamers?.length) {
        html += `<div style="font-size:11px;color:var(--text-secondary);margin-bottom:6px">最爱送礼主播</div>`;
        html += '<div style="display:flex;flex-direction:column;gap:3px;margin-bottom:10px">';
        p.topStreamers.slice(0, 3).forEach((s, i) => {
          html += `<div style="display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;font-size:12px">
            <span style="color:var(--orange);font-weight:700;width:16px;text-align:center;font-variant-numeric:tabular-nums">${String(i+1).padStart(2,'0')}</span>
            <span style="color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.name)}</span>
            <span style="color:var(--orange);font-weight:600;font-variant-numeric:tabular-nums"><svg viewBox="0 0 24 24" width="12" height="12" style="vertical-align:-2px;fill:currentColor"><path d="M6 2h12l4 7-10 13L2 9z"/><path d="M2 9h20" stroke="rgba(255,255,255,0.2)" stroke-width="0.7" fill="none"/><path d="M12 22l-4-13h8z" fill="rgba(0,0,0,0.1)"/></svg>${s.diamonds.toLocaleString()}</span>
          </div>`;
        });
        html += '</div>';
      }
      // 最常送的礼物
      if (p.topGiftsByCount?.length) {
        html += `<div style="font-size:11px;color:var(--text-secondary);margin-bottom:6px">最常送礼物</div>`;
        html += '<div style="display:flex;flex-direction:column;gap:3px">';
        p.topGiftsByCount.slice(0, 3).forEach((g, i) => {
          html += `<div style="display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;font-size:12px">
            <span style="color:var(--orange);font-weight:700;width:16px;text-align:center;font-variant-numeric:tabular-nums">${String(i+1).padStart(2,'0')}</span>
            <span style="font-size:14px">${g.icon_url ? `<img src="${esc(g.icon_url)}" style="width:20px;height:20px;vertical-align:-4px" onerror="this.style.display='none'">` : giftEmoji(g.gift_name)}</span>
            <span style="color:var(--text);flex:1">${esc(g.gift_name)}</span>
            <span style="color:var(--text-muted)">×${g.count}</span>
            <span style="color:var(--orange);font-weight:600;font-variant-numeric:tabular-nums"><svg viewBox="0 0 24 24" width="12" height="12" style="vertical-align:-2px;fill:currentColor"><path d="M6 2h12l4 7-10 13L2 9z"/><path d="M2 9h20" stroke="rgba(255,255,255,0.2)" stroke-width="0.7" fill="none"/><path d="M12 22l-4-13h8z" fill="rgba(0,0,0,0.1)"/></svg>${g.total_diamonds.toLocaleString()}</span>
          </div>`;
        });
        html += '</div>';
      }
    }

    // ====== 弹幕采样 ======
    if (p.danmakuSamples?.length || p.danmakuStyle) {
      html += `<div class="profile-section-title" style="margin-top:14px">弹幕风格</div>`;
      if (p.danmakuStyle) {
        html += `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">`;
        p.danmakuStyle.split('·').forEach(t => {
          html += `<div style="padding:4px 10px;background:rgba(var(--accent-rgb,59,130,246),0.12);border-radius:5px;font-size:11px;color:var(--accent)">${esc(t)}</div>`;
        });
        html += `<div style="padding:4px 10px;background:var(--bg-card);border:1px solid var(--border);border-radius:5px;font-size:11px;color:var(--text-muted)">共 ${p.danmakuCount || 0} 条弹幕</div>`;
        html += '</div>';
      }
      if (p.danmakuSamples?.length) {
        html += '<div style="display:flex;flex-direction:column;gap:3px">';
        p.danmakuSamples.forEach(d => {
          let content = d.content || '';
          if (content.length > 60) content = content.slice(0, 60) + '…';
          const ts = fmtTime(d.create_time);
          html += `<div style="padding:5px 8px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;font-size:12px;display:flex;gap:8px;align-items:flex-start">
            <span style="color:var(--text);flex:1;line-height:1.4">${esc(content)}</span>
            <span style="color:var(--text-muted);font-size:10px;flex-shrink:0;white-space:nowrap">${ts}</span>
          </div>`;
        });
        html += '</div>';
      }
    }

    body.innerHTML = html;
  } catch (e) { body.innerHTML = `<div class="empty" style="padding:20px">加载失败: ${esc(e.message)}</div>`; }
}

function closeProfileModal() {
  document.getElementById('profileModal')?.classList.remove('show');
}

// ========== CONFIRM MODAL ==========
let _confirmCb = null;
function showConfirm(icon, html) {
  return new Promise(resolve => {
    _confirmCb = resolve;
    document.getElementById('confirmIcon').innerHTML = icon;
    document.getElementById('confirmText').innerHTML = html;
    document.getElementById('confirmModal').style.display = 'flex';
  });
}
function confirmResolve(val) {
  document.getElementById('confirmModal').style.display = 'none';
  if (_confirmCb) { _confirmCb(val); _confirmCb = null; }
}

let _lookupData = null;
function showAddRoom() {
  _lookupData = null;
  document.getElementById('addRoomModal').style.display = 'flex';
  document.getElementById('addRoomInput').value = '';
  document.getElementById('addRoomResult').style.display = 'none';
  document.getElementById('addRoomConfirmBtn').disabled = true;
  document.getElementById('lookupBtn').disabled = false;
  document.getElementById('addRoomInput').focus();
}
function closeAddRoom() {
  document.getElementById('addRoomModal').style.display = 'none';
  _lookupData = null;
}
async function lookupRoom() {
  const input = document.getElementById('addRoomInput').value.trim();
  if (!input) return;
  const btn = document.getElementById('lookupBtn');
  btn.disabled = true;
  btn.textContent = '查询中...';
  try {
    const r = await fetch(`${API}/api/rooms/lookup?q=${encodeURIComponent(input)}`).then(r => r.json());
    if (r.error) { toast(r.error, 'error'); btn.disabled = false; btn.textContent = '查询'; return; }
    _lookupData = r;
    document.getElementById('addRoomResult').style.display = 'block';
    document.getElementById('addRoomName').value = r.nickname || '';
    document.getElementById('addRoomName').placeholder = r.nickname ? '可修改名称' : '请输入主播名称';
    // 预览
    const preview = document.getElementById('addRoomPreview');
    preview.innerHTML = r.avatar ? `<img src="${r.avatar}" style="width:40px;height:40px;border-radius:50%;object-fit:cover">` : '';
    preview.innerHTML += `<div><div style="font-weight:500;font-size:13px">${esc(r.nickname) || '<span style="color:var(--text-muted);font-style:italic">待解析</span>'}</div>`;
    preview.innerHTML += `<div style="font-size:11px;color:var(--text-muted)">房间号: ${r.room_id || '未开播'}${r.is_live ? ' · <span style="color:var(--green)">直播中</span>' : ''}</div></div>`;
    document.getElementById('addRoomConfirmBtn').disabled = false;
  } catch (e) { toast('查询失败: ' + e.message, 'error'); }
  btn.disabled = false;
  btn.textContent = '查询';
}
async function confirmAddRoom() {
  if (!_lookupData || !_lookupData.room_id) { toast('请先查询房间信息', 'error'); return; }
  const name = document.getElementById('addRoomName').value.trim() || _lookupData.nickname;
  const btn = document.getElementById('addRoomConfirmBtn');
  btn.disabled = true;
  btn.textContent = '添加中...';
  try {
    const r = await fetch(`${API}/api/rooms/add`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ room_id: _lookupData.room_id, name }) }).then(r => r.json());
    toast(r.ok ? `已添加 ${name || _lookupData.room_id}` : (r.error || '添加失败'), r.ok ? 'success' : 'error');
    closeAddRoom();
    if (r.ok) {
      // 乐观更新：立即插入本地缓存并渲染，不转圈
      const newRoom = { room_id: _lookupData.room_id, name: name || _lookupData.nickname, avatar: _lookupData.avatar, enabled: true, connected: false, recording: false, session_count: 0 };
      if (state.rooms) state.rooms.push(newRoom);
      const el = document.getElementById('content');
      if (el && state.summary) _renderRoomsView(el, state.summary, state.rooms);
      // 2秒后后台刷新，让 monitor 解析完主播名
      setTimeout(() => loadRoomsView(), 2000);
    }
  } catch(e) { toast('网络错误: ' + e.message, 'error'); }
  finally { btn.disabled = false; btn.textContent = '确认添加'; }
}

async function updateStats() {
  // Update status chips from existing DOM cards
  const cards = document.querySelectorAll('.room-card');
  let connected = 0, paused = 0;
  cards.forEach(card => {
    const badge = card.querySelector('.host-badge');
    if (!badge) return;
    const text = badge.textContent;
    if (text.includes('监控中') || text.includes('直播中')) connected++;
    else paused++;
  });
  const el1 = document.getElementById('statusLiveCount');
  const el2 = document.getElementById('statusPausedCount');
  if (el1) el1.textContent = connected;
  if (el2) el2.textContent = paused;
  // Re-fetch summary and update all stat cards
  try {
    const summary = await api('/api/summary');
    const update = (key, val) => {
      const el = document.querySelector(`.stat-card[data-stat="${key}"] .stat-value`);
      if (el) el.textContent = val;
    };
    update('rooms', cards.length);
    update('sessions', summary.total_sessions);
    update('gifts', summary.total_gifts.toLocaleString());
    update('diamonds', summary.total_diamonds.toLocaleString());
    update('danmaku', summary.total_danmaku.toLocaleString());
    update('users', summary.unique_users.toLocaleString());
  } catch(e) {}
}
function updateCard(roomId, patch) {
  const cards = document.querySelectorAll('.room-card');
  for (const card of cards) {
    const onclick = card.getAttribute('onclick') || '';
    if (onclick.includes(`'${roomId}'`) || onclick.includes(`"${roomId}"`)) {
      if (patch.enabled !== undefined) {
        const actions = card.querySelector('.room-card-actions');
        if (actions) {
          const btn = actions.querySelector('.action-btn');
          if (patch.enabled) {
            btn.className = 'action-btn';
            btn.title = '暂停';
            btn.innerHTML = ICO.pause;
            btn.setAttribute('onclick', `event.stopPropagation();pauseRoom('${roomId}')`);
          } else {
            btn.className = 'action-btn action-btn-resume';
            btn.title = '恢复';
            btn.innerHTML = ICO.play;
            btn.setAttribute('onclick', `event.stopPropagation();resumeRoom('${roomId}')`);
          }
        }
      }
      if (patch.badge !== undefined) {
        const meta = card.querySelector('.host-meta');
        if (meta) {
          const badge = meta.querySelector('.host-badge');
          if (badge) {
            badge.className = `host-badge ${patch.badge.cls}`;
            badge.textContent = patch.badge.text;
          }
        }
      }
      break;
    }
  }
}
async function pauseRoom(roomId) {
  if (!await showConfirm(ICO.pause, '确定暂停这个房间的监控？')) return;
  try {
    const r = await fetch(`${API}/api/rooms/pause`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ room_id: roomId }) }).then(r => r.json());
    toast(r.ok ? '已暂停' : (r.error || '操作失败'), r.ok ? 'success' : 'error');
    if (r.ok) { updateCard(roomId, { enabled: false, badge: { cls: 'badge-paused', text: '已暂停' } }); updateStats(); }
  } catch(e) { toast('网络错误: ' + e.message, 'error'); }
}

async function resumeRoom(roomId) {
  try {
    const r = await fetch(`${API}/api/rooms/resume`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ room_id: roomId }) }).then(r => r.json());
    toast(r.ok ? '已恢复' : (r.error || '操作失败'), r.ok ? 'success' : 'error');
    if (r.ok) { updateCard(roomId, { enabled: true, badge: { cls: 'badge-idle', text: '已启用' } }); updateStats(); }
  } catch(e) { toast('网络错误: ' + e.message, 'error'); }
}


async function confirmDeleteRoom(roomId, name) {
  const confirmed = await showConfirm('🗑️', `确定删除 <strong>${esc(name || roomId)}</strong>？<br><br>将停止监控并清除所有历史数据<br>（弹幕、礼物、场次记录）<br><br>此操作不可恢复！`);
  if (!confirmed) return;
  try {
    const r = await fetch(`${API}/api/rooms/remove`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ room_id: roomId, delete_data: true }) }).then(r => r.json());
    toast(r.ok ? '已删除' : (r.error || '删除失败'), r.ok ? 'success' : 'error');
    if (r.ok) {
      const cards = document.querySelectorAll('.room-card');
      for (const card of cards) {
        if (card.getAttribute('onclick')?.includes(roomId)) {
          card.style.transition = 'opacity .2s, transform .2s';
          card.style.opacity = '0';
          card.style.transform = 'scale(0.95)';
          setTimeout(() => { card.remove(); updateStats(); }, 200);
          break;
        }
      }
    }
  } catch(e) { toast('网络错误: ' + e.message, 'error'); }
}

async function deleteSession(sessionId) {
  const confirmed = await showConfirm('🗑️', `确定删除这场直播数据？<br><br>弹幕、礼物、在线记录将一并清除<br>此操作不可恢复！`);
  if (!confirmed) return;
  try {
    const r = await fetch(`${API}/api/sessions/${sessionId}/delete`, { method: 'POST' }).then(r => r.json());
    toast(r.ok ? '场次已删除' : (r.error || '删除失败'), r.ok ? 'success' : 'error');
    if (r.ok) { viewSessions(state.hostId); }
  } catch(e) { toast('网络错误: ' + e.message, 'error'); }
}

function statCard(label, value, key, sub) {
  return `<div class="stat-card"${key ? ` data-stat="${key}"` : ''}><div class="stat-label">${label}</div><div class="stat-value">${value}</div>${sub ? `<div class="stat-sub">${sub}</div>` : ''}</div>`;
}

// ========== VIEW: SESSIONS ==========
async function viewSessions(hostId, fromPopState) {
  stopAutoRefresh();
  state._gen++;  // 取消正在进行的 loadRoomsView 等请求
  state.view = 'sessions';
  state.hostId = hostId;
  state.sessionId = null;
  if (!fromPopState) pushNav('sessions', { hostId });
  updateBreadcrumb();
  const el = document.getElementById('content');
  el.classList.remove('content-fade-in');
  el.innerHTML = '<div class="loading">加载中...</div>';

  try {
    const sessions = await fetch(`${API}/api/hosts/${hostId}/sessions`).then(r => r.json());
    state.sessions = sessions;

    // Stats
    const totalGifts = sessions.reduce((s, x) => s + x.gift_count, 0);
    const totalDiamonds = sessions.reduce((s, x) => s + x.total_diamonds, 0);
    const totalDanmaku = sessions.reduce((s, x) => s + x.danmaku_count, 0);
    const totalUsers = sessions.reduce((s, x) => s + x.user_count, 0);
    const totalLikes = sessions.reduce((s, x) => s + (x.stats_like || 0), 0);
    let html = '<div class="stats-row">';
    html += statCard('场次', sessions.length);
    html += statCard('礼物', totalGifts.toLocaleString());
    html += statCard('钻石', totalDiamonds.toLocaleString());
    html += statCard('弹幕', totalDanmaku.toLocaleString());
    html += statCard('用户', totalUsers.toLocaleString());
    html += statCard('点赞', totalLikes.toLocaleString());
    html += '</div>';

    // Session table header
    html += '<div class="section"><div class="section-header"><div class="section-title">场次列表</div></div>';
    html += '<div class="filter-bar">';
    html += '<label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12" style="vertical-align:-2px"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> 日期</label>';
    html += '<div class="dp-input" id="dpFrom" onclick="dpOpen(\'from\')"><span class="dp-ph">开始日期</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>';
    html += '<span class="filter-sep">~</span>';
    html += '<div class="dp-input" id="dpTo" onclick="dpOpen(\'to\')"><span class="dp-ph">结束日期</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>';
    html += '<button class="filter-btn" onclick="clearDateFilter()">清除</button>';
    html += '</div>';

    html += '<div style="overflow-x:auto"><table class="session-table"><thead><tr>';
    html += '<th style="width:36px;padding-left:8px"><input type="checkbox" class="session-cb" id="selectAll" onchange="toggleSelectAll()"></th>';
    html += '<th>场次</th><th>状态</th><th>开始时间</th><th>结束时间</th><th>时长</th><th>礼物</th><th>钻石</th><th>弹幕</th><th>用户</th><th style="width:80px">操作</th>';
    html += '</tr></thead><tbody id="sessionTbody"></tbody></table></div></div>';
    el.innerHTML = html;

    // Render rows in chunks for responsiveness
    const tbody = document.getElementById('sessionTbody');
    const CHUNK = 15;
    let idx = 0;
    function renderChunk() {
      const end = Math.min(idx + CHUNK, sessions.length);
      let rows = '';
      for (let i = idx; i < end; i++) {
        const s = sessions[i];
        const dur = s.duration_min != null ? formatDuration(s.duration_min) : '-';
        rows += `<tr data-id="${s.id}" data-start="${s.started_at || ''}">
          <td data-label="" onclick="event.stopPropagation()" style="padding-left:8px"><input type="checkbox" class="session-cb" value="${s.id}" onchange="updateBatchBar()"></td>
          <td data-label="场次" onclick="viewDetail('${s.id}')" style="font-weight:500">${esc(s.title || '未命名')}</td>
          <td data-label="状态" onclick="viewDetail('${s.id}')"><span class="session-badge ${s.is_live ? 'live' : 'offline'}">${s.is_live ? '直播中' : '已结束'}</span></td>

// ========== VIEW: DETAIL ==========
async function viewDetail(sessionId, fromPopState) {
  stopAutoRefresh(); // stop any previous timer
  state._gen++;  // 取消正在进行的请求
  state.view = 'detail';
  state.sessionId = sessionId;
  state.tab = 'gifts';
  state._danmaku = null; // 清除上一场次的弹幕缓存
  if (!fromPopState) pushNav('detail', { sessionId });
  document.getElementById('batchFloat')?.classList.remove('show');
  updateBreadcrumb();
  const el = document.getElementById('content');
  el.classList.remove('content-fade-in');
  el.innerHTML = '<div class="loading">加载中...</div>';

  try {
    const data = await fetch(`${API}/api/sessions/${sessionId}/detail`).then(r => r.json());

  if (data.session.is_live) startAutoRefresh();

    html += '<button class="btn btn-ghost btn-sm" onclick="manualRefresh()" id="refreshBtn" style="font-size:12px;padding:4px 10px;display:flex;align-items:center;gap:4px;min-width:72px;justify-content:center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> 刷新</button>';

  // Empty panel placeholders — lazy rendered on tab switch

  el.innerHTML = html;
  el.classList.add('content-fade-in');

  // Render active tab + anon tab (lightweight) immediately
  renderTabPanel(activeTab, data);
  renderTabPanel('anon', data);

  // Pre-render other tabs in idle time
  const tabs = ['anchors', 'gifts', 'danmaku', 'report'].filter(t => t !== activeTab);
  let i = 0;
  function renderNext() {
    if (i < tabs.length) {
      renderTabPanel(tabs[i], data);
      i++;
      if (typeof requestIdleCallback !== 'undefined') requestIdleCallback(renderNext, { timeout: 200 });
      else setTimeout(renderNext, 0);
    }
  }
  if (typeof requestIdleCallback !== 'undefined') requestIdleCallback(renderNext, { timeout: 200 });
  else setTimeout(renderNext, 50);
}

// ========== AUTO-REFRESH (live sessions) ==========
let _refreshTimer = null;
let _refreshing = false;

function startAutoRefresh() {
  stopAutoRefresh();
  _refreshTimer = setInterval(async () => {
    if (state.view !== 'detail' || !state.sessionId || _refreshing) return;
    await refreshDetail();
  }, 15000);
}

function stopAutoRefresh() {
  if (_refreshTimer) { clearInterval(_refreshTimer); _refreshTimer = null; }
}

let _manualRefresh = false;

async function manualRefresh() {
  _manualRefresh = true;
  const btn = document.getElementById('refreshBtn');
  if (btn) {
    btn.disabled = true;
    const svg = btn.querySelector('svg');
    if (svg) svg.style.animation = 'spin .6s linear infinite';
  }
  await refreshDetail();
  _manualRefresh = false;
  if (btn) {
    btn.disabled = false;
    const svg = btn.querySelector('svg');
    if (svg) svg.style.animation = '';
  }
}

// FLIP animation helper: records positions, updates DOM, animates
function flipAnimate(container, selector, updateFn) {
  if (!container) return;
  const items = container.querySelectorAll(selector);
  const oldRects = new Map();
  const oldKeys = new Map();
  items.forEach(el => {
    oldRects.set(el, el.getBoundingClientRect());
    // Use text content as key for matching
    oldKeys.set(el, el.textContent.trim().substring(0, 30));
  });
  updateFn();
  const newItems = container.querySelectorAll(selector);
  // Build reverse lookup: oldKey -> oldRect
  const oldByKey = new Map();
  oldKeys.forEach((key, el) => oldByKey.set(key, oldRects.get(el)));
  
  newItems.forEach(el => {
    const newKey = el.textContent.trim().substring(0, 30);
    const oldRect = oldByKey.get(newKey);
    if (!oldRect) {
      // New item — fade in with scale
      el.classList.add('flip-new');
      return;
    }
    const newRect = el.getBoundingClientRect();
    const dy = oldRect.top - newRect.top;
    if (Math.abs(dy) < 1) return;
    el.style.transform = `translateY(${dy}px)`;
    el.style.transition = 'none';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        el.style.transition = '';
        el.style.transform = '';
      });
    });
  });
}

// Smooth number update with counter animation
function animateNumber(el, newVal) {
  if (!el) return;
  const oldText = el.textContent.replace(/[^\d]/g, '');
  const oldVal = parseInt(oldText) || 0;
  if (oldVal === newVal) return;
  const diff = newVal - oldVal;
  const steps = 20;
  const stepTime = 300 / steps;
  let step = 0;
  const tick = () => {
    step++;
    const progress = step / steps;
    const eased = 1 - Math.pow(1 - progress, 3); // ease-out cubic
    const current = Math.round(oldVal + diff * eased);
    el.textContent = current.toLocaleString();
    if (step < steps) setTimeout(tick, stepTime);
    else el.textContent = newVal.toLocaleString();
  };
  tick();
}

async function refreshDetail() {
  if (!state.sessionId || _refreshing) return;
  _refreshing = true;
  try {
    const data = await fetch(`${API}/api/sessions/${state.sessionId}/detail`).then(r => r.json());
    state._detailData = data;
    smoothUpdateDetail(data);
    // Stop auto-refresh if session ended
    if (!data.session.is_live) stopAutoRefresh();
  } catch (e) { /* silent */ }
  _refreshing = false;
}

function smoothUpdateDetail(data) {
  const s = data.session;
  
  // 0. Dynamic anchor tab — add if anchor count crosses threshold
  const anchorCount = data.anchorRanking ? data.anchorRanking.length : 0;
  const tabBar = document.getElementById('tabBar');
  const existingAnchorBtn = tabBar?.querySelector('button[onclick*="anchors"]');
  const existingAnchorPanel = document.getElementById('panel-anchors');
  
  if (anchorCount > 1 && !existingAnchorBtn && tabBar) {
    // Add anchor tab button at the beginning
    const anchorBtn = document.createElement('button');
    anchorBtn.className = 'tab-btn';
    anchorBtn.setAttribute('onclick', "switchTab('anchors')");
    anchorBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> 主播排名';

    const anchorPanel = document.createElement('div');
    anchorPanel.className = 'tab-panel';
    anchorPanel.id = 'panel-anchors';
    const firstPanel = tabBar.nextElementSibling;

    // Notify user

    notice.textContent = '🎯 检测到多位主播，已自动添加主播排名tab';
    document.body.appendChild(notice);
    setTimeout(() => notice.remove(), 3000);
  }
  
  // 1. Stats — update numbers in place
  const statCards = document.querySelectorAll('.stats-row .stat-card');
  const newStats = [
    data.session.online_peak || 0,
    data.summary.total_diamonds,
    s.stats_like || 0,
    data.summary.danmaku_count,
    data.summary.user_count,
    null // duration — don't animate
  ];
  statCards.forEach((card, i) => {
    if (i < newStats.length && newStats[i] != null) {
      const valEl = card.querySelector('.stat-value');
      if (valEl) {
        const num = typeof newStats[i] === 'number' ? newStats[i] : parseInt(newStats[i]);
        if (!isNaN(num)) animateNumber(valEl, num);
      }
    }
  });

  // 2. Gift ranking — FLIP update
  const giftGrid = document.querySelector('#panel-gifts .gift-rank-grid');
  if (giftGrid && data.gifts && data.gifts.length > 0) {
    flipAnimate(giftGrid, '.gift-rank-card', () => {

  const anchorGrid = document.querySelector('#panel-anchors .anchor-grid');

      anchorGrid.innerHTML = data.anchorRanking.map((a, i) => `
        <div class="anchor-card" onclick="openAnchorModal('${esc(a.anchor_name)}', ${s.id})">

            <div class="stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12" style="vertical-align:-2px"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8V6c0-2-1.5-4-4-4S4 4 4 6h2"/><path d="M20 6c0-2-1.5-4-4-4s-4 2-4 4h2"/><line x1="12" y1="8" x2="12" y2="21"/><line x1="3" y1="13" x2="21" y2="13"/></svg> <span class="stat-val">${a.gift_count.toLocaleString()}</span></div>
            <div class="stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12" style="vertical-align:-2px"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> <span class="stat-val">${a.user_count}</span></div>
          </div>
        </div>`).join('');
    });
  }
  
  // 5. Update giftDetails cache for modal

  // 6. Update danmaku list — 自动刷新时跳过弹幕tab（避免打断浏览），手动刷新时正常更新
  const danmakuPanel = document.getElementById('panel-danmaku');
  const isDanmakuActive = danmakuPanel && danmakuPanel.classList.contains('active');
  if ((!isDanmakuActive || _manualRefresh) && data.danmaku && data.danmaku.length > 0) {

    const recent = normalized.slice(0, 80);
    renderDanmakuList(recent);
    const badge = document.getElementById('dmTotalBadge');
    if (badge) {

      badge.textContent = total > 80 ? `显示前 80 / 共 ${total.toLocaleString()} 条` : '';
    }
  }
}

            <div class="anchor-card-avatar">${a.anchor_avatar ? `<img src="${a.anchor_avatar}" alt="" onerror="this.parentElement.innerHTML='<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; width=&quot;18&quot; height=&quot;18&quot;><path d=&quot;M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2&quot;/><circle cx=&quot;9&quot; cy=&quot;7&quot; r=&quot;4&quot;/></svg>'">` : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>'}</div>

// ========== WORD CLOUD ==========
function renderWordCloud(words) {
  const canvas = document.getElementById('wordcloudCanvas');
  if (!canvas || !words.length) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const W = rect.width, H = rect.height;
  ctx.clearRect(0, 0, W, H);

  // 直接用原始内容，不过度切割
  const wordFreq = {};
  words.forEach(w => {
    const text = w.content?.trim();
    if (!text || text.length < 2 || text.length > 12) return;
    // 跳过纯标点/emoji
    if (!/[\u4e00-\u9fa5a-zA-Z0-9]/.test(text)) return;
    // 提取纯文本片段（去掉emoji和特殊符号）
    const clean = text.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '');
    if (clean.length >= 2 && clean.length <= 10) {
      wordFreq[clean] = (wordFreq[clean] || 0) + w.cnt;
    }
    // 也保留原文（如果够短）
    if (text.length <= 8 && text !== clean) {
      wordFreq[text] = (wordFreq[text] || 0) + w.cnt;
    }
  });

  // Sort by frequency, take top words
  const sorted = Object.entries(wordFreq).sort((a, b) => b[1] - a[1]);
  // Deduplicate: remove substrings that are parts of higher-ranked words
  const finalWords = [];
  const used = new Set();
  for (const [word, freq] of sorted) {
    if (finalWords.length >= 40) break;
    if (used.has(word)) continue;
    // Skip if it's a substring of an already added longer word
    let isSubstring = false;
    for (const usedWord of used) {
      if (usedWord.includes(word) && usedWord.length > word.length) { isSubstring = true; break; }
    }
    if (isSubstring) continue;
    finalWords.push([word, freq]);
    used.add(word);
  }

  if (!finalWords.length) {
    ctx.fillStyle = 'var(--text-muted)';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂无词频数据', W / 2, H / 2);
    return;
  }

  const maxFreq = finalWords[0][1];
  const minFreq = finalWords[finalWords.length - 1][1];
  const colors = ['#6c8cff', '#a78bfa', '#fb923c', '#4ade80', '#f87171', '#facc15', '#f472b6', '#38bdf8', '#c084fc', '#34d399'];

  // Place words using spiral placement
  const placed = [];
  const padding = 4;
  const cx = W / 2, cy = H / 2;

  finalWords.forEach(([word, freq], idx) => {
    const ratio = maxFreq > minFreq ? (freq - minFreq) / (maxFreq - minFreq) : 0.5;
    const fontSize = 13 + ratio * 24;
    ctx.font = `bold ${fontSize}px "PingFang SC", "Microsoft YaHei", sans-serif`;
    const metrics = ctx.measureText(word);
    const tw = metrics.width + padding * 2;
    const th = fontSize + padding * 2;

    // 螺旋放置：从中心向外
    let placed_ok = false;
    for (let t = 0; t < 800; t++) {
      const angle = t * 0.3;
      const radius = t * 0.8;
      const x = cx + radius * Math.cos(angle) - tw / 2;
      const y = cy + radius * Math.sin(angle) - th / 2;
      if (x < -10 || x + tw > W + 10 || y < -10 || y + th > H + 10) continue;
      let collision = false;
      for (const p of placed) {
        if (x < p.x + p.w + padding && x + tw + padding > p.x && y < p.y + p.h + padding && y + th + padding > p.y) {
          collision = true; break;
        }
      }
      if (!collision) {
        const color = colors[idx % colors.length];
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.55 + ratio * 0.45;
        ctx.fillText(word, x + padding, y + th - fontSize * 0.3);
        ctx.globalAlpha = 1;
        placed.push({ x, y, w: tw, h: th });
        placed_ok = true;
        break;
      }
    }
  });
}

// ========== ANCHOR MODAL ==========
function openAnchorModal(anchorName, sessionId) {
  const modal = document.getElementById('anchorModal');
  const title = document.getElementById('anchorModalTitle');
  const body = document.getElementById('anchorModalBody');
  title.textContent = anchorName;
  body.classList.remove('modal-body-fade');

  // Use existing giftDetails data (instant, no API call)
  const allGifts = window._giftDetails || [];
  const filtered = allGifts.filter(g => g.to_nickname === anchorName);
  if (!filtered.length) {
    body.innerHTML = '<div class="empty" style="padding:20px">暂无礼物数据</div>';
    modal.classList.add('show');
    return;
  }
  // Aggregate by user_sec_uid (giver)
  const aggMap = {};
  filtered.forEach(g => {
    const uid = g.user_sec_uid || g.nickname;
    if (!aggMap[uid]) aggMap[uid] = { nickname: g.nickname, avatar_url: g.avatar_url, total_diamonds: 0, gift_count: 0 };
    // 优先用非神秘人的名字和头像（脱了衣服后的最新身份）
    if (g.nickname && !g.nickname.startsWith('神秘人')) {
      aggMap[uid].nickname = g.nickname;
      if (g.avatar_url) aggMap[uid].avatar_url = g.avatar_url;
    }
    aggMap[uid].total_diamonds += g.total_diamonds;
    aggMap[uid].gift_count += g.count;
  });
  const gifts = Object.values(aggMap).sort((a, b) => b.total_diamonds - a.total_diamonds);
  const totalD = gifts.reduce((s, g) => s + g.total_diamonds, 0);
  const totalU = gifts.length;

  let html = `<div class="anchor-modal-summary"><span><svg viewBox="0 0 24 24" width="12" height="12" style="vertical-align:-2px;fill:var(--orange)"><path d="M6 2h12l4 7-10 13L2 9z"/><path d="M2 9h20" stroke="rgba(255,255,255,0.2)" stroke-width="0.7" fill="none"/><path d="M12 22l-4-13h8z" fill="rgba(0,0,0,0.1)"/></svg> <span class="sv">${totalD.toLocaleString()}</span></span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12" style="vertical-align:-2px"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> <span class="sv">${totalU}</span> 人</span></div>`;
    html += '<div class="gift-list-card">';
    gifts.forEach((g, i) => {
      const rankBadge = `<span class="gift-rank-num">${String(i + 1).padStart(2, '0')}</span>`;
      html += `<div class="gift-list-item">
        ${rankBadge}
        <div class="user-cell">${avatarHtml(g.avatar_url, g.nickname)}<span>${esc(g.nickname)}</span></div>
        <div class="diamonds"><svg viewBox="0 0 24 24" width="12" height="12" style="vertical-align:-2px;margin-right:2px;fill:currentColor"><path d="M6 2h12l4 7-10 13L2 9z"/><path d="M2 9h20" stroke="rgba(255,255,255,0.2)" stroke-width="0.7" fill="none"/><path d="M12 22l-4-13h8z" fill="rgba(0,0,0,0.1)"/></svg> ${g.total_diamonds.toLocaleString()}</div>
      </div>`;
    });
    html += '</div>';
    body.innerHTML = html;
    body.classList.add('modal-body-fade');
  modal.classList.add('show');
}

// ========== TAB SWITCH ==========
function switchTab(tab) {
  state.tab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => {
    const match = b.getAttribute('onclick')?.match(/switchTab\('(\w+)'\)/);
    b.classList.toggle('active', match && match[1] === tab);
  });
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  const panel = document.getElementById('panel-' + tab);
  if (panel) {
    panel.classList.add('active');
    if (!panel.dataset.rendered) {
      if (state._detailData) renderTabPanel(tab, state._detailData);
    }
  }
  if (tab === 'anon' || tab === 'danmaku') loadDanmaku();
  if (tab === 'danmaku') setTimeout(() => {
    renderWordCloud(state._detailData?.danmakuWords || []);
    const left = document.getElementById('danmakuLeft');
    const right = document.getElementById('danmakuRight');
    if (left && right) right.style.height = left.offsetHeight + 'px';
  }, 50);
}

// ========== ANONYMOUS QUERY ==========
async function queryAnonymous() {
  const input = document.getElementById('anonInput');
  const result = document.getElementById('anonResult');
  if (!input || !result) return;
  const q = (input.value || '').trim();
  if (!q) { result.innerHTML = '<div class="empty" style="padding:20px">请输入查询内容</div>'; return; }

  const data = state._detailData;
  if (!data) { result.innerHTML = '<div class="empty" style="padding:20px">数据未加载，请稍后重试</div>'; return; }

  // 确保弹幕数据已加载
  if (!state._danmaku) {
    result.innerHTML = '<div class="loading">加载弹幕数据...</div>';
    await loadDanmaku();
  }

  const matches = [];
  const qLower = q.toLowerCase();

  // Search danmaku
  (state._danmaku || []).forEach(d => {
    const name = (d.nickname || '').toLowerCase();
    const content = (d.content || '').toLowerCase();
    if (name.includes(qLower) || content.includes(qLower)) {
      matches.push({ type: '弹幕', nickname: d.nickname, content: d.content, time: d.timestamp, avatar: d.avatar_url });
    }
  });

  // Search gifts (per-gift breakdown, search by nickname OR gift name)
  (data.giftDetails || []).forEach(g => {
    const nameLower = (g.nickname || '').toLowerCase();
    const giftLower = (g.gift_name || '').toLowerCase();
    if (nameLower.includes(qLower) || giftLower.includes(qLower)) {
      matches.push({ type: '礼物', nickname: g.nickname, content: `${g.gift_name || '礼物'} ×${g.count}`, time: null, avatar: g.avatar_url, diamonds: g.total_diamonds, giftIcon: g.gift_icon || null, to_nickname: g.to_nickname || '' });
    }
  });

  if (matches.length === 0) {
    result.innerHTML = `<div class="anon-result"><div class="empty" style="padding:20px">未找到匹配 "${esc(q)}" 的记录</div></div>`;
    return;
  }

  let html = '<div class="anon-result">';
  // 匹配记录区
  html += `<div style="font-size:13px;color:var(--text-muted);margin-bottom:12px">找到 ${matches.length} 条匹配记录</div>`;
  matches.forEach(m => {
    html += `<div class="anon-result-item">
      <div style="flex-shrink:0">${avatarHtml(m.avatar, m.nickname)}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
          <span style="font-size:13px;font-weight:600;color:var(--text)">${esc(m.nickname || '匿名')}</span>
          <span style="font-size:11px;padding:1px 6px;border-radius:4px;background:${m.type === '礼物' ? 'rgba(251,146,60,0.15)' : 'rgba(108,140,255,0.15)'};color:${m.type === '礼物' ? 'var(--orange)' : 'var(--accent)'}">${m.type}</span>
          ${m.diamonds ? `<span style="font-size:12px;font-weight:600;color:var(--orange)"><svg viewBox="0 0 24 24" width="12" height="12" style="vertical-align:-2px;fill:currentColor"><path d="M6 2h12l4 7-10 13L2 9z"/><path d="M2 9h20" stroke="rgba(255,255,255,0.2)" stroke-width="0.7" fill="none"/><path d="M12 22l-4-13h8z" fill="rgba(0,0,0,0.1)"/></svg>${m.diamonds.toLocaleString()}</span>` : ''}
        </div>
        <div style="font-size:12px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(m.content)}">${m.type === '礼物' ? (m.giftIcon ? `<img src="${esc(m.giftIcon)}" style="width:16px;height:16px;vertical-align:-3px;margin-right:2px;border-radius:3px">` : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" style="vertical-align:-2px;margin-right:2px;flex-shrink:0"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8V6c0-2-1.5-4-4-4S4 4 4 6h2"/><path d="M20 6c0-2-1.5-4-4-4s-4 2-4 4h2"/><line x1="12" y1="8" x2="12" y2="21"/><line x1="3" y1="13" x2="21" y2="13"/></svg>') : ''}${replaceDouyinEmoji(esc((m.content || '').substring(0, 60)))}${m.to_nickname ? ` <span style="color:var(--accent)">→ ${esc(m.to_nickname)}</span>` : ''}</div>
      </div>
    </div>`;
  });
  html += '</div>';
  result.innerHTML = html;
}

// ========== DANMAKU ==========
const _douyinEmojiMap = {'打call':'📢','看':'👀','鼓掌':'👏','比心':'🫰','笑哭':'😂','耶':'✌️','发呆':'😶','发怒':'😠','呲牙':'😁','害羞':'😊','尬笑':'😅','尴尬流汗':'😓','快哭了':'😢','抠鼻':'🤏','捂脸':'🤦','杀马特':'🤘','流泪':'😭','色':'🥰','衰':'😫','赞':'👍','黑脸':'🫥','不看':'🙈','戳手手':'👉👈','舔屏':'😍'};
function replaceDouyinEmoji(s) { return s ? s.replace(/\[([^\]]+)\]/g, (_, name) => _douyinEmojiMap[name] || '[' + name + ']') : ''; }
function renderDanmakuList(items, isSearch = false) {
  const list = document.getElementById('rtDanmakuList');
  if (!list) return;
  let html = '';
  for (const d of items) {
    html += `<div class="anon-result-item" style="padding:6px 0">
      <div style="flex-shrink:0;min-width:0">${avatarHtml(d.avatar_url || d.avatar, d.nickname)}</div>
      <div style="flex:1;min-width:0;overflow:hidden">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:1px;min-width:0">
          <span style="font-size:13px;font-weight:600;color:var(--text);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px">${esc(d.nickname || '匿名')}</span>
          <span style="font-size:11px;padding:1px 6px;border-radius:4px;background:rgba(108,140,255,0.15);color:var(--accent);flex-shrink:0">${fmtTime(d.timestamp)}</span>
        </div>
        <div style="font-size:12px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(d.content)}">${replaceDouyinEmoji(esc(d.content))}</div>
      </div>
    </div>`;
  }
  if (!html) {
    const msg = isSearch ? '无匹配弹幕' : '暂时没有弹幕';
    list.innerHTML = `<div class="empty" style="padding:40px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:180px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="32" height="32" style="margin-bottom:10px;opacity:0.3"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><div style="color:var(--text-muted);font-size:13px">${msg}</div></div>`;
  } else {
    list.innerHTML = html;
  }
}

let _danmakuLoading = false;
async function loadDanmaku() {
  if (state._danmaku) return; // already loaded
  if (_danmakuLoading) return; // already loading
  _danmakuLoading = true;
  try {
    const sid = state.sessionId;
    const resp = await fetch(`${API}/api/sessions/${sid}/danmaku?limit=99999`);
    const data = await resp.json();
    const raw = data.data || data.danmaku || [];
    // Normalize field names (API returns create_time/avatar, frontend expects timestamp/avatar_url)
    state._danmaku = raw.map(d => ({
      ...d,
      timestamp: d.timestamp || d.create_time,
      avatar_url: d.avatar_url || d.avatar
    }));
    _danmakuLoading = false;
    // If user typed a search query while loading, re-run filter; otherwise show recent 80
    const searchInput = document.getElementById('danmakuSearch');
    if (searchInput && searchInput.value.trim()) {
      filterDanmaku();
    } else {
      const recent = state._danmaku.slice(0, 80);
      const badge = document.getElementById('dmTotalBadge');
      if (badge && state._danmaku.length > 80) {
        badge.textContent = `显示前 80 / 共 ${state._danmaku.length.toLocaleString()} 条`;
      }
      renderDanmakuList(recent);
    }
  } catch (e) {
    _danmakuLoading = false;
    const list = document.getElementById('rtDanmakuList');
    if (list) list.innerHTML = '<div class="empty" style="padding:20px">弹幕加载失败</div>';
  }
}

function filterDanmaku() {
  const q = (document.getElementById('danmakuSearch')?.value || '').toLowerCase();
  // 如果数据还没加载完，触发加载（加载完成后会自动重新调用 filterDanmaku）
  if (!state._danmaku && !_danmakuLoading) {
    loadDanmaku();
    return;
  }
  if (_danmakuLoading) return; // 加载中，等 loadDanmaku 完成后自动触发
  const all = state._danmaku || [];
  let filtered;
  if (q) {
    filtered = all.filter(d => d.content?.toLowerCase().includes(q) || d.nickname?.toLowerCase().includes(q));
  } else {
    filtered = all.slice(0, 80);
    const badge = document.getElementById('dmTotalBadge');
    if (badge && all.length > 80) {
      badge.textContent = `显示前 80 / 共 ${all.length.toLocaleString()} 条`;
    } else if (badge) {
      badge.textContent = '';
    }
  }
  renderDanmakuList(filtered, !!q);
}

// ========== CHARTS ==========
function renderCharts(data) {
  if (!data) return;
  state._detailData = data;

  // Destroy old
  Object.values(charts).forEach(c => c.destroy?.());
  charts = {};

  const timeline = data.summary.timeline || [];
  if (timeline.length === 0) return;

  const labels = timeline.map(t => fmtTime(t.time));
  const chartOpts = { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#6b7084', maxTicksLimit: 8, font: { size: 10 } }, grid: { color: 'rgba(45,48,57,0.5)' } }, y: { ticks: { color: '#6b7084', font: { size: 10 } }, grid: { color: 'rgba(45,48,57,0.5)' } } } };

  charts.timeline = new Chart(document.getElementById('chartTimeline'), {
    type: 'line',
    data: { labels, datasets: [{ data: timeline.map(t => t.gifts), borderColor: '#6c8cff', backgroundColor: 'rgba(108,140,255,0.1)', fill: true, tension: 0.3, pointRadius: 2 }] },
    options: { ...chartOpts, plugins: { ...chartOpts.plugins, title: { display: true, text: '礼物趋势', color: '#9ca0ad', font: { size: 12 } } } }
  });

  // Gift distribution
  const giftMap = {};
  data.gifts.forEach(g => { giftMap[g.gift_name] = (giftMap[g.gift_name] || 0) + g.total_diamonds; });
  const sorted = Object.entries(giftMap).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const colors = ['#6c8cff', '#a78bfa', '#fb923c', '#4ade80', '#f87171', '#facc15'];
  charts.giftDist = new Chart(document.getElementById('chartGiftDist'), {
    type: 'doughnut',
    data: { labels: sorted.map(s => s[0]), datasets: [{ data: sorted.map(s => s[1]), backgroundColor: colors, borderWidth: 0 }] },
    options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'right', labels: { color: '#9ca0ad', font: { size: 11 }, padding: 8 } }, title: { display: true, text: '礼物分布', color: '#9ca0ad', font: { size: 12 } } } }
  });

  charts.diamonds = new Chart(document.getElementById('chartDiamonds'), {
    type: 'bar',
    data: { labels, datasets: [{ data: timeline.map(t => t.diamonds), backgroundColor: 'rgba(251,146,60,0.6)', borderRadius: 3 }] },
    options: { ...chartOpts, plugins: { ...chartOpts.plugins, title: { display: true, text: '钻石趋势', color: '#9ca0ad', font: { size: 12 } } } }
  });

  charts.danmaku = new Chart(document.getElementById('chartDanmaku'), {
    type: 'bar',
    data: { labels, datasets: [{ data: timeline.map(t => t.danmaku), backgroundColor: 'rgba(167,139,250,0.6)', borderRadius: 3 }] },
    options: { ...chartOpts, plugins: { ...chartOpts.plugins, title: { display: true, text: '弹幕趋势', color: '#9ca0ad', font: { size: 12 } } } }
  });
}

// ========== BATCH OPERATIONS ==========
function toggleSelectAll() {
  const checked = document.getElementById('selectAll').checked;
  document.querySelectorAll('.session-cb').forEach(cb => {
    cb.checked = checked;
    cb.closest('tr')?.classList.toggle('selected', checked);
  });
  updateBatchBar();
}

function updateBatchBar() {
  const cbs = [...document.querySelectorAll('.session-cb')].filter(cb => cb.id !== 'selectAll');
  const checked = cbs.filter(cb => cb.checked);
  const float = document.getElementById('batchFloat');
  const count = document.getElementById('batchCount');
  // 更新行选中样式
  cbs.forEach(cb => cb.closest('tr')?.classList.toggle('selected', cb.checked));
  // 显示/隐藏浮动栏
  if (float) float.classList.toggle('show', checked.length > 0);
  if (count) count.textContent = checked.length;
}

function getSelectedIds() {
  return [...document.querySelectorAll('.session-cb:checked')].map(cb => parseInt(cb.value));
}

// ========== DATE PICKER ==========
let dpState = { type: null, year: 0, month: 0, day: 0, temp: null };
const dpData = { from: null, to: null }; // 'YYYY-MM-DD' or null
const DP_CALENDAR_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';

function dpOpen(type) {
  dpState.type = type;
  const val = dpData[type];
  const now = val ? new Date(val + 'T00:00:00') : new Date();
  dpState.year = now.getFullYear();
  dpState.month = now.getMonth();
  dpState.day = val ? now.getDate() : 0;
  dpState.temp = val;
  dpRender();
  document.getElementById('dpOverlay').classList.add('show');
}

function dpClose() {
  document.getElementById('dpOverlay').classList.remove('show');
}

function dpNav(dir) {
  dpState.month += dir;
  if (dpState.month > 11) { dpState.month = 0; dpState.year++; }
  if (dpState.month < 0) { dpState.month = 11; dpState.year--; }
  dpRender();
}

function dpRender() {
  const { year, month, day } = dpState;
  const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('dpTitle').textContent = `${year}年 ${months[month]}`;

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const selectedStr = dpState.temp;

  let html = '';
  // 上月补位
  const prevDays = new Date(year, month, 0).getDate();
  for (let i = firstDay - 1; i >= 0; i--) {
    html += `<button class="dp-day other" disabled>${prevDays - i}</button>`;
  }
  // 本月
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls = [
      ds === todayStr ? 'today' : '',
      ds === selectedStr ? 'selected' : ''
    ].filter(Boolean).join(' ');
    html += `<button class="dp-day ${cls}" onclick="dpPick('${ds}')">${d}</button>`;
  }
  // 下月补位
  const total = firstDay + daysInMonth;
  const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let i = 1; i <= remaining; i++) {
    html += `<button class="dp-day other" disabled>${i}</button>`;
  }
  document.getElementById('dpDays').innerHTML = html;
}

function dpPick(dateStr) {
  dpState.temp = dateStr;
  dpRender();
}

function dpConfirm() {
  const type = dpState.type;
  const val = dpState.temp;
  dpData[type] = val;
  // 更新显示
  const el = document.getElementById(type === 'from' ? 'dpFrom' : 'dpTo');
  if (el) {
    if (val) {
      el.innerHTML = `<span class="dp-val">${val}</span>${DP_CALENDAR_ICON}`;
    } else {
      el.innerHTML = `<span class="dp-ph">${type === 'from' ? '开始日期' : '结束日期'}</span>${DP_CALENDAR_ICON}`;
    }
  }
  dpClose();
  filterByDate();
}

function dpClear() {
  dpState.temp = null;
  dpRender();
}

function clearDateFilter() {
  dpData.from = null;
  dpData.to = null;
  const fromEl = document.getElementById('dpFrom');
  const toEl = document.getElementById('dpTo');
  if (fromEl) fromEl.innerHTML = `<span class="dp-ph">开始日期</span>${DP_CALENDAR_ICON}`;
  if (toEl) toEl.innerHTML = `<span class="dp-ph">结束日期</span>${DP_CALENDAR_ICON}`;
  document.querySelectorAll('.session-table tbody tr').forEach(tr => tr.style.display = '');
}

function filterByDate() {
  const from = dpData.from;
  const to = dpData.to;
  if (!from && !to) { clearDateFilter(); return; }
  document.querySelectorAll('.session-table tbody tr').forEach(tr => {
    const start = tr.dataset.start;
    if (!start) return;
    const d = start.substring(0, 10);
    let show = true;
    if (from && d < from) show = false;
    if (to && d > to) show = false;
    tr.style.display = show ? '' : 'none';
  });
}

function downloadReport(sessionId) {
  window.open(`${API}/api/sessions/${sessionId}/report`, '_blank');
}

function downloadSelectedReports() {
  const ids = getSelectedIds();
  if (ids.length === 0) { toast('请先选择场次', 'error'); return; }
  ids.forEach((id, i) => {
    setTimeout(() => window.open(`${API}/api/sessions/${id}/report`, '_blank'), i * 500);
  });
  toast(`正在生成 ${ids.length} 份报告...`, 'success');
}

async function deleteSessionFromList(sessionId) {
  const confirmed = await showConfirm('🗑️', '确定删除这场直播数据？<br><br>弹幕、礼物、在线记录将一并清除<br>此操作不可恢复！');
  if (!confirmed) return;
  try {
    const r = await fetch(`${API}/api/sessions/${sessionId}/delete`, { method: 'POST' }).then(r => r.json());
    toast(r.ok ? '场次已删除' : (r.error || '删除失败'), r.ok ? 'success' : 'error');
    if (r.ok) viewSessions(state.hostId);
  } catch(e) { toast('网络错误: ' + e.message, 'error'); }
}

async function deleteSelectedSessions() {
  const ids = getSelectedIds();
  if (ids.length === 0) { toast('请先选择场次', 'error'); return; }
  const confirmed = await showConfirm('🗑️', `确定删除选中的 <strong>${ids.length}</strong> 场数据？<br><br>弹幕、礼物、在线记录将一并清除<br>此操作不可恢复！`);
  if (!confirmed) return;
  let ok = 0, fail = 0;
  for (const id of ids) {
    try {
      const r = await fetch(`${API}/api/sessions/${id}/delete`, { method: 'POST' }).then(r => r.json());
      r.ok ? ok++ : fail++;
    } catch(e) { fail++; }
  }
  toast(`已删除 ${ok} 场${fail ? `，${fail} 场失败` : ''}`, ok > 0 ? 'success' : 'error');
  viewSessions(state.hostId);
}

// ========== HELPERS ==========
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function fmtTime(ts) { if (!ts) return '-'; let d; if (typeof ts === 'number' || (typeof ts === 'string' && /^\d+$/.test(ts.trim()))) { const n = Number(ts); d = new Date(n > 1e12 ? n : n * 1000); } else { d = new Date(ts); } return d.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }); }
function formatDuration(min) { if (min < 60) return min + '分钟'; const h = Math.floor(min / 60), m = min % 60; return m > 0 ? `${h}h ${m}m` : `${h}h`; }
function avatarHtml(url, name, size) { const s = size ? `width:${size}px;height:${size}px` : ''; return url ? `<div class="avatar" style="${s}"><img src="${url}" alt="" onerror="this.parentElement.innerHTML='${name?.[0] || '?'}'"></div>` : `<div class="avatar" style="${s};display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-muted)">${name?.[0] || '?'}</div>`; }
function giftEmoji(name) { if (!name) return '🎁'; if (name.includes('火箭') || name.includes('🚀')) return '🚀'; if (name.includes('跑车') || name.includes('🚗')) return '🚗'; if (name.includes('嘉年华')) return '🎪'; if (name.includes('玫瑰')) return '🌹'; if (name.includes('棒棒糖')) return '🍭'; if (name.includes('啤酒')) return '🍺'; if (name.includes('比心')) return '❤️'; return '🎁'; }

// ========== INIT ==========

history.replaceState({ view: 'hosts' }, '', location.href);
viewHosts(true);
