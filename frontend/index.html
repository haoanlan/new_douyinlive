<!doctype html>
<html>
  <head>
    <title>抖音直播监控</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="抖音直播监控 —— 直播间弹幕、礼物、在线人数与场次报表的采集与监控面板。" />
    <!-- 用 SVG 图标：与侧栏/登录页同一个标记，且不需要再维护一份 .ico -->
    <link rel="icon" type="image/svg+xml" href="src/assets/images/common/logo.svg" />

    <style>
      /* 防止页面刷新时白屏的初始样式 */
      html {
        background-color: #fafbfc;
      }

      html.dark {
        background-color: #070707;
      }

      /*
       * --custom-radius 的兜底值。
       *
       * 这个变量**只由 JS 写入**（useTheme.ts / store/modules/setting.ts 里 setProperty），
       * 而所有卡片圆角都写成 `calc(var(--custom-radius) / …)`：
       * 变量不存在时，calc() 里的 var() 无效 → **整条 border-radius 声明失效** →
       * 页面首帧先把卡片画成直角、JS 跑完才跳成圆角（用户实测"刚加载时直角变圆角"）。
       * 这里在最早的时机（HTML 内联样式，先于任何 JS 和外部 CSS）给出与默认设置一致的兜底，
       * 之后 JS 仍会按用户在设置里选的值覆盖。
       */
      :root {
        --custom-radius: 0.75rem;
      }
    </style>

    <script>
      // 初始化 html class 主题属性
      ;(function () {
        try {
          if (typeof Storage === 'undefined' || !window.localStorage) {
            return
          }

          const themeType = localStorage.getItem('sys-theme')
          if (themeType === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          console.warn('Failed to apply initial theme:', e)
        }
      })()
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
