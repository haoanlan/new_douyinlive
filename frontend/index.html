<!doctype html>
<html>
  <head>
    <title>抖音直播监控</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="抖音直播监控 —— 直播间弹幕、礼物、在线人数与场次报表的采集与监控面板。" />
    <!-- 用 SVG 图标：与侧栏/登录页同一个标记，且不需要再维护一份 .ico -->
    <link rel="icon" type="image/svg+xml" href="src/assets/images/common/logo.svg" />

    <style>
      /* 防止页面刷新时白屏的初始样式 */
      html {
        background-color: #fafbfc;
      }

      html.dark {
        background-color: #070707;
      }
    </style>

    <script>
      // 初始化 html class 主题属性
      ;(function () {
        try {
          if (typeof Storage === 'undefined' || !window.localStorage) {
            return
          }

          const themeType = localStorage.getItem('sys-theme')
          if (themeType === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          console.warn('Failed to apply initial theme:', e)
        }
      })()
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
