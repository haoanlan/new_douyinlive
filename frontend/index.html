<!doctype html>
<html>
  <head>
    <title>抖音直播监控</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="抖音直播监控 —— 直播间弹幕、礼物、在线人数与场次报表的采集与监控面板。" />
    <!-- 用 SVG 图标：与侧栏/登录页同一个标记，且不需要再维护一份 .ico -->
    <link rel="icon" type="image/svg+xml" href="src/assets/images/common/logo.svg" />

    <style>
      /* 防止页面刷新时白屏的初始样式 */
      html {
        background-color: #fafbfc;
      }

      html.dark {
        background-color: #070707;
      }

      /*
       * --custom-radius 的兜底值。
       *
       * 这个变量**只由 JS 写入**（useTheme.ts / store/modules/setting.ts 里 setProperty），
       * 而所有卡片圆角都写成 `calc(var(--custom-radius) / …)`：
       * 变量不存在时，calc() 里的 var() 无效 → **整条 border-radius 声明失效** →
       * 页面首帧先把卡片画成直角、JS 跑完才跳成圆角（用户实测"刚加载时直角变圆角"）。
       * 这里在最早的时机（HTML 内联样式，先于任何 JS 和外部 CSS）给出与默认设置一致的兜底，
       * 之后 JS 仍会按用户在设置里选的值覆盖。
       */
      :root {
        --custom-radius: 0.75rem;
      }
    </style>

    <script>
      // 初始化 html class 主题属性
      ;(function () {
        try {
          if (typeof Storage === 'undefined' || !window.localStorage) {
            return
          }

          const themeType = localStorage.getItem('sys-theme')
          if (themeType === 'dark') {
            document.documentElement.classList.add('dark')
          }

          /*
           * 盒子模式必须**在首帧之前**写到根元素上。
           *
           * 卡片的背景与圆角写在 CSS 的 [data-box-mode='border-mode'] 分支里
           * （assets/styles/core/app.scss），而这个属性原本只由 JS 在设置面板初始化时设置：
           * 在它生效之前，.art-card 只命中「只有边框」的那条基础规则 ——
           * 也就是**透明底 + 直角**，JS 跑完才跳成白底圆角。
           * 实测（生产版整页刷新）：t=164ms 卡片已出现但 radius=0px、background=rgba(0,0,0,0)；
           * t=393ms 才变成 radius=16px、background=rgb(255,255,255) —— 中间 230ms 就是用户看到的
           * "不立体 + 直角变圆角"。
           *
           * 这里按持久化设置给出首帧值（读不到就用默认 border-mode，与 config/setting.ts 的
           * boxBorderMode: true 一致），JS 之后仍会按用户在设置里的选择覆盖。
           */
          let boxMode = ''
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i)
            if (!key || !/setting$/.test(key)) continue
            try {
              const saved = JSON.parse(localStorage.getItem(key) || '{}')
              if (saved && typeof saved.boxBorderMode === 'boolean') {
                boxMode = saved.boxBorderMode ? 'border-mode' : 'shadow-mode'
                break
              }
            } catch {
              /* 单个键解析失败就跳过，不影响其它键 */
            }
          }
          document.documentElement.setAttribute('data-box-mode', boxMode || 'border-mode')
        } catch (e) {
          console.warn('Failed to apply initial theme:', e)
        }
      })()
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  
    <!-- TEMP-DIAG: 真机诊断面板（?diag=1 时显示）。确认完根因后删除。 -->
    <script>
      (function () {
        if (!/[?&]diag=1/.test(location.search)) return;
        var box = document.createElement('pre');
        box.style.cssText =
          'position:fixed;left:0;bottom:0;z-index:2147483647;background:rgba(0,0,0,.88);color:#0f0;' +
          'font:12px/1.45 monospace;padding:8px;margin:0;max-width:100%;white-space:pre-wrap;pointer-events:none';
        function snap() {
          var lc = document.querySelector('.layout-content');
          var b = document.body, h = document.documentElement;
          return {
            lc: lc ? Math.round(lc.getBoundingClientRect().width) : null,
            bs: (b.getAttribute('style') || '-').slice(0, 60),
            bp: getComputedStyle(b).paddingRight,
            hs: h.offsetWidth - h.clientWidth,
            hg: getComputedStyle(h).scrollbarGutter,
            lock: b.classList.contains('el-popup-parent--hidden')
          };
        }
        var last = '', lines = [];
        function tick() {
          var s = snap(), k = JSON.stringify(s);
          if (k === last) return;
          last = k;
          lines.push((s.lock ? '开' : '关') + ' lc=' + s.lc + ' htmlSb=' + s.hs + ' gutter=' + s.hg + ' bodyPad=' + s.bp + ' bodyStyle=' + s.bs);
          lines = lines.slice(-8);
          box.textContent = 'DIAG 临时诊断（开/关各一次即可）\n' + lines.join('\n');
        }
        setInterval(tick, 150);
        window.addEventListener('load', function () { document.body.appendChild(box); });
      })();
    </script>
  
    <!-- TEMP-DIAG2: 行对齐诊断（?diag=1）。dy-detail-row 左/右间距 vs 卡片标题左缘。 -->
    <script>
      (function () {
        if (!/[?&]diag=1/.test(location.search)) return;
        var box = document.createElement('pre');
        box.style.cssText =
          'position:fixed;left:0;top:0;z-index:2147483647;background:rgba(0,0,0,.88);color:#ff0;' +
          'font:12px/1.45 monospace;padding:8px;margin:0;max-width:100%;white-space:pre-wrap;pointer-events:none';
        function snap() {
          var row = document.querySelector('.dy-detail-row');
          if (!row) return 'no-row';
          var card = row.closest('.art-card') || row.parentElement;
          var cr = card.getBoundingClientRect();
          var cs = getComputedStyle(card);
          var padL = parseFloat(cs.paddingLeft) || 0, padR = parseFloat(cs.paddingRight) || 0;
          var rr = row.getBoundingClientRect();
          var title = card.querySelector('.art-card-header, h3, h2, .text-lg, .text-base');
          var tr = title ? title.getBoundingClientRect() : null;
          var val = row.querySelector('.font-bold, .text-theme');
          var vr = val ? val.getBoundingClientRect() : null;
          return 'row L=' + Math.round(rr.left - cr.left - padL) + ' R=' + Math.round(cr.right - padR - rr.right) +
                 ' | 标题左=' + (tr ? Math.round(tr.left - cr.left - padL) : 'n/a') +
                 ' | 值右=' + (vr ? Math.round(cr.right - padR - vr.right) : 'n/a') +
                 ' | 滚动条=' + (row.offsetWidth - row.clientWidth) + ' mr=' + getComputedStyle(row).marginRight;
        }
        var last = '';
        setInterval(function () {
          var s = snap();
          if (s === last) return;
          last = s;
          box.textContent = 'DIAG2 行对齐（黄）\n' + s;
        }, 400);
        window.addEventListener('load', function () { document.body.appendChild(box); });
      })();
    </script>
  
    <!-- TEMP-DIAG3: 行外层滚动容器诊断（?diag=1）。查那 2px 来自哪一层。 -->
    <script>
      (function () {
        if (!/[?&]diag=1/.test(location.search)) return;
        var box = document.createElement('pre');
        box.style.cssText =
          'position:fixed;right:0;top:0;z-index:2147483647;background:rgba(0,0,0,.88);color:#0ff;' +
          'font:11px/1.4 monospace;padding:6px;margin:0;max-width:60%;white-space:pre-wrap;pointer-events:none';
        function chain(el) {
          var out = [], n = 0;
          while (el && n < 4) {
            var cs = getComputedStyle(el);
            out.push(el.tagName.toLowerCase() + '.' + String(el.className).split(/\s+/).slice(0, 2).join('.') +
              ' w=' + Math.round(el.getBoundingClientRect().width) +
              ' sb=' + (el.offsetWidth - el.clientWidth) +
              ' mr=' + cs.marginRight + ' pr=' + cs.paddingRight + ' ovY=' + cs.overflowY);
            if (/auto|scroll/.test(cs.overflowY) && el.scrollHeight > el.clientHeight + 2) break;
            el = el.parentElement; n++;
          }
          return out.join('\n');
        }
        var last = '';
        setInterval(function () {
          var row = document.querySelector('.dy-detail-row');
          if (!row) return;
          var s = chain(row);
          if (s === last) return;
          last = s;
          box.textContent = 'DIAG3 容器链（青）\n' + s;
        }, 500);
        window.addEventListener('load', function () { document.body.appendChild(box); });
      })();
    </script>
  </body>
</html>
